<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Both schemes, in that order. This was `dark` alone while the app ships a
      light theme and a toggle, so in light mode the browser still painted its
      own chrome dark: native scrollbars, date and select popups, form control
      defaults and the flash of background before the first paint all came out
      dark on a light page.
    -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Scan, order, enjoy — the smart restaurant ordering platform." />
    <meta name="robots" content="noindex, nofollow" />
    <title>Order — Restaurant Platform</title>

    <!-- Google Fonts: Inter & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Tajawal:wght@300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-mesh-deep antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
