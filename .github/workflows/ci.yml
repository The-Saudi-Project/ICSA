name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      # npm ci (clean install) is better for CI environments than npm install
      # because it strictly follows the package-lock.json versioning
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Typecheck and Build
      # This runs your TypeScript checks and builds the project, catching syntax and type errors
      run: npm run build

    - name: Run Tests
      # This runs your tests if you have them, skipping safely if you don't
      run: npm run test --if-present
