name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Cache the mongod binary that mongodb-memory-server downloads,
      # otherwise every run re-downloads ~100 MB.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Run first and named separately so a tenant-isolation failure is
      # unmistakable in the checks list, not buried in the full test output.
      - name: Security tests (tenant isolation, RBAC, audit immutability)
        run: npm run test:security

      - name: Test
        run: npm test

  # Fails the build if a secret is committed. Cheap, and catches the mistake
  # that is most expensive to undo.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for committed .env files
        run: |
          if git ls-files --error-unmatch '.env' 2>/dev/null; then
            echo "::error::.env is tracked by git. Remove it and rotate every value it contained."
            exit 1
          fi
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Environment files are tracked: $tracked"
            exit 1
          fi
          echo "No environment files tracked."
